[package]
name = "mana-rt"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
corosensei = "0.3"
crossbeam-queue = "0.3.13"
getrandom = "0.2"
hmac = "0.12"
mio = { version = "1.2.2", features = ["net", "os-poll", "os-ext"] }

parking_lot = "0.12.5"
regex = "1.13.1"
rustc-hash = "2.1.3"
sha1 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1.25"

[dev-dependencies]
# A/B reference for the hand-rolled bigint kernel (see bigint.rs ab_bench)
num-bigint = "0.4"
